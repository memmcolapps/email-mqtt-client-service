name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main
      - alfuttaim

jobs:
  deploy-linux:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout source code
      # =====================
      - name: Checkout code
        uses: actions/checkout@v3

      # =====================
      # Setup Java
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =====================
      # Build application
      # =====================
      - name: Build with Maven
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      # =====================
      # Resolve JAR
      # =====================
      - name: Resolve JAR
        run: |
          JAR_FILE=$(find target -name "*.jar" ! -name "*original*.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "Found: $JAR_FILE"

      # =====================================================
      # SSH SETUP (STAGING)
      # =====================================================
      - name: Setup SSH Agent (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY STAGING
      # =====================================================
      - name: Deploy to Staging Server
        if: github.ref == 'refs/heads/staging'
        run: |
          SERVER="${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}"
          
          REMOTE_PATH="/${{secrets.LOCATION }}/email-mqtt-client-service.jar"
          
          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no $SERVER "mkdir -p /${{secrets.LOCATION }}"
          
          echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
          "$JAR_FILE" \
          $SERVER:$REMOTE_PATH
          
          echo "Writing env file..."
          
          ssh -o StrictHostKeyChecking=no $SERVER "cat > /${{secrets.LOCATION }}/.env.email" << EOF
          
          EUREKA_ADDRESS="${{ secrets.EUREKA_ADDRESS }}"
          EUREKA_PORT="${{ secrets.EUREKA_PORT }}"
          LOCATION="${{ secrets.LOCATION }}"
          DB_HOST="${{ secrets.DB_HOST }}"
          DB_PORT="${{ secrets.DB_PORT }}"
          DB_NAME="${{ secrets.DB_NAME }}"
          DB_USERNAME="${{ secrets.DB_USERNAME }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          SMTP_HOST="${{  secrets.SMTP_HOST }}"
          SMTP_PORT="${{ secrets.SMTP_PORT }}"
          SMTP_EMAIL="${{ secrets.SMTP_EMAIL }}"
          SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}"
          EOF
          
          ssh -o StrictHostKeyChecking=no $SERVER "chmod 600 /${{secrets.LOCATION }}/.env.email"
          
          echo "Starting service..."
          ssh -o StrictHostKeyChecking=no $SERVER "sudo systemctl start email"

          echo "Verifying service is running..."
          ssh -o StrictHostKeyChecking=no $SERVER "sleep 5 && sudo systemctl is-active email"
          
          echo "Deployment complete"
    

      # =====================================================
      # PRODUCTION DEPLOYMENT (branch: main)
      # =====================================================
      - name: Setup SSH Agent (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY PRODUCTION -
      # =====================================================
      - name: Deploy to Production Server
        if: github.ref == 'refs/heads/main'
        run: |
          SERVER="${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}"
          REMOTE_PATH="/${{ secrets.LOCATION }}/email-mqtt-client-service.jar"

          echo "Creating remote directory..."

          ssh -o StrictHostKeyChecking=no $SERVER "mkdir -p /${{secrets.LOCATION }}"

          echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH

          echo "Writing env file..."
          ssh -o StrictHostKeyChecking=no $SERVER "cat > /${{secrets.LOCATION }}/.env.email" << EOF

          EUREKA_ADDRESS="${{ secrets.EUREKA_ADDRESS }}"
          EUREKA_PORT="${{ secrets.EUREKA_PORT }}"
          LOCATION="${{ secrets.LOCATION }}" 
          DB_HOST="${{ secrets.DB_HOST }}"
          DB_PORT="${{ secrets.DB_PORT }}"
          DB_NAME="${{ secrets.DB_NAME }}"
          DB_USERNAME="${{ secrets.DB_USERNAME }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          SMTP_HOST="${{  secrets.SMTP_HOST }}"
          SMTP_PORT="${{ secrets.SMTP_PORT }}"
          SMTP_EMAIL="${{ secrets.SMTP_EMAIL }}"
          SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}"
          MONGO_DB="${{ secrets.MONGO_DB  }}"
          MONGO_USERNAME="${{ secrets.MONGO_USERNAME }}"
          MONGO_PASSWORD="${{ secrets.MONGO_PASSWORD }}"
          MONGO_HOST="${{ secrets.MONGO_HOST }}"
          MONGO_PORT="${{ secrets.MONGO_PORT }}"
          EOF

          ssh -o StrictHostKeyChecking=no $SERVER "chmod 600 /${{secrets.LOCATION }}/.env.email"

          echo "Deploying (safe SSH execution)..."
          ssh -o StrictHostKeyChecking=no $SERVER 'bash -s' << 'EOF'

            set -e

            echo "Stopping app safely..."

            PID=$(ps -ef | grep email-mqtt-client-service.jar | grep -v grep | awk '{print $2}')

            if [ -n "$PID" ]; then
              echo "Killing PID: $PID"
              kill -9 $PID || true
            else
              echo "No running process found"
            fi

            echo "Starting app..."

            set -a
            source /${{ secrets.LOCATION }}/.env.email
            set +a

            nohup java -Dspring.profiles.active=prod \
              -jar /${{secrets.LOCATION }}/email-mqtt-client-service.jar \
              >/dev/null 2>&1 < /dev/null &

            echo "Deployment complete"
          EOF

  deploy-alfuttaim:
    if: github.ref == 'refs/heads/alfuttaim'

    runs-on: ubuntu-latest

    env:
      APP_NAME: email-mqtt-client-service
      SERVICE_NAME: email-mqtt-client-service
      DEPLOY_DIR: 'C:\${{ secrets.WIN_LOCATION }}'
      JAR_NAME: email-mqtt-client-service.jar

    steps:
      #######################################################
      # Checkout Repository
      #######################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      #######################################################
      # Setup Java
      #######################################################
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ==========================
      # Build
      # ==========================
      - name: Build Application
        run: mvn clean package -DskipTests

      #######################################################
      # Locate JAR
      #######################################################
      - name: Locate Executable JAR
        shell: bash
        run: |

          JAR=$(find . \
            -type f \
            -path "*/target/*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            ! -name "*original*.jar" \
            | head -n1)

          if [ -z "$JAR" ]; then
            echo "Executable jar not found."
            exit 1
          fi

          echo "Found: $JAR"

          cp "$JAR" app.jar

      #######################################################
      # Generate WinSW XML
      #######################################################
      - name: Generate WinSW XML
        shell: bash
        run: |
          cp deployment/email-mqtt-client-service.xml.template email-mqtt-client-service.xml

          DB_PASSWORD_XML=$(printf '%s' "${{ secrets.DB_PASSWORD }}" \
            | sed -e 's/&/\&amp;/g' \
            -e 's/</\&lt;/g' \
            -e 's/>/\&gt;/g' \
            -e "s/'/\&apos;/g" \
            -e 's/"/\&quot;/g')

          DB_PASSWORD_XML=$(printf '%s' "$DB_PASSWORD_XML" | sed 's/&/\\&/g')

          sed -i "s|\${EUREKA_ADDRESS}|${{ secrets.EUREKA_ADDRESS }}|g" email-mqtt-client-service.xml
          sed -i "s|\${EUREKA_PORT}|${{ secrets.EUREKA_PORT }}|g" email-mqtt-client-service.xml
          sed -i "s|\${WIN_LOCATION}|C:/${{secrets.WIN_LOCATION}}|g" email-mqtt-client-service.xml
          sed -i "s|\${DB_HOST}|${{ secrets.DB_HOST }}|g" email-mqtt-client-service.xml
          sed -i "s|\${DB_PORT}|${{ secrets.DB_PORT }}|g" email-mqtt-client-service.xml
          sed -i "s|\${DB_NAME}|${{ secrets.DB_NAME }}|g" email-mqtt-client-service.xml

          sed -i "s|\${DB_USERNAME}|${{ secrets.DB_USERNAME }}|g" email-mqtt-client-service.xml
          sed -i "s|\${DB_PASSWORD}|${DB_PASSWORD_XML}|g" email-mqtt-client-service.xml
          sed -i "s|\${PROD_MONGO_HOST}|${{ secrets.PROD_MONGO_HOST }}|g" email-mqtt-client-service.xml

          sed -i "s|\${SMTP_HOST}|${{ secrets.SMTP_HOST }}|g" email-mqtt-client-service.xml
          sed -i "s|\${SMTP_PORT}|${{ secrets.SMTP_PORT }}|g" email-mqtt-client-service.xml
          sed -i "s|\${SMTP_EMAIL}|${{ secrets.SMTP_EMAIL }}|g" email-mqtt-client-service.xml
          sed -i "s|\${SMTP_PASSWORD}|${{ secrets.SMTP_PASSWORD }}|g" email-mqtt-client-service.xml
          
          sed -i "s|\${MONGO_DB}|${{ secrets.MONGO_DB }}|g" email-mqtt-client-service.xml
          sed -i "s|\${MONGO_USERNAME}|${{ secrets.MONGO_USERNAME }}|g" email-mqtt-client-service.xml
          sed -i "s|\${MONGO_PASSWORD}|${{ secrets.MONGO_PASSWORD }}|g" email-mqtt-client-service.xml
          sed -i "s|\${MONGO_HOST}|${{ secrets.MONGO_HOST }}|g" email-mqtt-client-service.xml
          sed -i "s|\${MONGO_PORT}|${{ secrets.MONGO_PORT }}|g" email-mqtt-client-service.xml


          echo "Generated WinSW XML:"

          cat email-mqtt-client-service.xml

      #######################################################
      # Configure SSH
      #######################################################
      - name: Configure SSH
        shell: bash
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.WINDOW_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan ${{ secrets.WINDOW_SERVER_HOST }} >> ~/.ssh/known_hosts

      #######################################################
      # Create Deployment Directory
      #######################################################
      - name: Create Deployment Directory
        run: |
          ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference = 'Stop'

          New-Item `
          -ItemType Directory `
          -Force `
          -Path 'C:/${{ secrets.WIN_LOCATION }}' | Out-Null

          New-Item `
          -ItemType Directory `
          -Force `
          -Path 'C:/${{ secrets.WIN_LOCATION }}/logs' | Out-Null

          Write-Host "Deployment directory ready."

          EOF

      #######################################################
      # Stop WinSW Service
      #######################################################
      - name: Stop Windows Service
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference = 'Stop'

          $service = Get-Service -Name 'email-mqtt-client-service' -ErrorAction Stop

          Write-Host "Current Status: $($service.Status)"

          if ($service.Status -eq 'Running') {

              Write-Host "Stopping service..."

              Stop-Service -Name 'email-mqtt-client-service'

              $service.WaitForStatus(
                  'Stopped',
                  '00:00:30'
              )

          }

          $service = Get-Service -Name 'email-mqtt-client-service'

          if ($service.Status -ne 'Stopped') {

              throw "Failed to stop service."

          }

          Write-Host "Service stopped successfully."

          EOF

      #######################################################
      # Backup Existing JAR
      #######################################################
      - name: Backup Existing JAR
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference='Stop'

          $jar="C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.jar"

          $backup="C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.jar.bak"

          if(Test-Path $jar){

              Copy-Item `
                  $jar `
                  $backup `
                  -Force

              Write-Host "Backup completed."

          }
          else{

              Write-Host "No existing JAR. Backup skipped."

          }

          EOF

      #######################################################
      # Upload New JAR
      #######################################################
      - name: Upload Application
        run: |

          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            app.jar \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{secrets.WIN_LOCATION}}/email-mqtt-client-service.jar"

      #######################################################
      # Upload WinSW XML
      #######################################################
      - name: Upload WinSW XML
        run: |
          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            email-mqtt-client-service.xml \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{secrets.WIN_LOCATION}}/email-mqtt-client-service.xml"

      #######################################################
      # Verify Uploaded Files
      #######################################################
      - name: Verify Upload
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

              $files = @(
                  'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.exe',
                  'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.jar',
                  'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.xml'
              )

              foreach($file in $files){

                  if(!(Test-Path $file)){
                      throw "Missing: $file"
                  }

                  Write-Host "Verified: $file"

              }

              Get-ChildItem C:\${{ secrets.WIN_LOCATION }}

            END

      #######################################################
      # Start Windows Service
      #######################################################
      - name: Start Windows Service
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference='Stop'

          Write-Host "Starting email-mqtt-client-service..."

          Start-Service -Name "email-mqtt-client-service"

          Start-Sleep -Seconds 5

          $service = Get-Service -Name "email-mqtt-client-service"

          $service.WaitForStatus(
              "Running",
              "00:00:30"
          )

          $service = Get-Service -Name "email-mqtt-client-service"

          if($service.Status -ne "Running"){

              throw "Service failed to start."

          }

          Write-Host "Service started successfully."

          EOF

      #######################################################
      # Verify Java Process
      #######################################################
      - name: Verify Java Process
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference='Stop'

          $java = Get-CimInstance Win32_Process |
          Where-Object {

              $_.Name -eq "java.exe" -and
              $_.CommandLine -like "*email-mqtt-client-service.jar*"

          }

          if(!$java){

              throw "Java process not running."

          }

          Write-Host "Java PID: $($java.ProcessId)"

          EOF

      #######################################################
      # Verify Deployment
      #######################################################
      - name: Verify Deployment
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            powershell -Command "

            Write-Host ''

            Write-Host '========== SERVICE =========='

            Get-Service email-mqtt-client-service

            Write-Host ''

            Write-Host '========== FILES =========='

            Get-ChildItem C:/${{ secrets.WIN_LOCATION}}

            Write-Host ''

            Write-Host '========== LOGS =========='

            Get-ChildItem C:/${{ secrets.WIN_LOCATION }}/logs -ErrorAction SilentlyContinue

            "
      #######################################################
      # Display Logs On Failure
      #######################################################
      - name: Display Logs
        if: failure()
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            powershell -Command "

            Write-Host ''
            Write-Host '========== WinSW OUT =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.out.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.out.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== WinSW ERR =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.err.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.err.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== WRAPPER LOG =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/wrapper.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/wrapper.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== SPRING LOG =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/logs/email.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/logs/email.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== GC LOG =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/logs/gc.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/logs/gc.log' -Tail 100
            }

            "

