name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main
      - alfuttaim

jobs:

  deploy-linux:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    concurrency:
      group: apigateway-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # =====================
      # Checkout source code
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Setup Java
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =====================
      # Build application
      # =====================
      - name: Build with Maven
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      # =====================
      # Resolve JAR
      # =====================
      - name: Resolve JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR_FILE="$(find target -type f -name '*.jar' ! -name '*original*.jar' | head -n 1)"

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No application JAR found."
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"
          echo "Application JAR resolved successfully."

      # =====================
      # Setup SSH Agent - Staging
      # =====================
      - name: Setup SSH Agent (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================
      # Setup SSH Agent - Production
      # =====================
      - name: Setup SSH Agent (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================
      # Deploy with systemd
      # =====================
      - name: Deploy Email MQTT Client
        shell: bash
        env:
          SERVER_USER: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_SERVER_USER || secrets.PROD_SERVER_USER }}
          SERVER_HOST: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_SERVER_HOST || secrets.PROD_SERVER_HOST }}
          SSH_PORT: '22'

          LOCATION: ${{ secrets.LOCATION }}
          APP_PROFILE: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'prod' }}

          EUREKA_ADDRESS: ${{ secrets.EUREKA_ADDRESS }}
          EUREKA_PORT: ${{ secrets.EUREKA_PORT }}

          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          MONGO_DB: ${{ secrets.MONGO_DB }}
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          MONGO_HOST: ${{ secrets.MONGO_HOST }}
          MONGO_PORT: ${{ secrets.MONGO_PORT }}

        run: |
          set -euo pipefail

          : "${SERVER_USER:?Missing server user}"
          : "${SERVER_HOST:?Missing server host}"
          : "${LOCATION:?Missing LOCATION secret}"
          : "${EUREKA_ADDRESS:?Missing EUREKA_ADDRESS secret}"
          : "${EUREKA_PORT:?Missing EUREKA_PORT secret}"
          : "${DB_HOST:?Missing DB_HOST secret}"
          : "${DB_PORT:?Missing DB_PORT secret}"
          : "${DB_NAME:?Missing DB_NAME secret}"
          : "${DB_USERNAME:?Missing DB_USERNAME secret}"
          : "${DB_PASSWORD:?Missing DB_PASSWORD secret}"
          : "${SMTP_HOST:?Missing SMTP_HOST secret}"
          : "${SMTP_PORT:?Missing SMTP_PORT secret}"
          : "${SMTP_EMAIL:?Missing SMTP_EMAIL secret}"
          : "${SMTP_PASSWORD:?Missing SMTP_PASSWORD secret}"

          if [ "$APP_PROFILE" = "prod" ]; then
            : "${MONGO_DB:?Missing MONGO_DB secret}"
            : "${MONGO_USERNAME:?Missing MONGO_USERNAME secret}"
            : "${MONGO_PASSWORD:?Missing MONGO_PASSWORD secret}"
            : "${MONGO_HOST:?Missing MONGO_HOST secret}"
            : "${MONGO_PORT:?Missing MONGO_PORT secret}"
          fi

          LOCATION="${LOCATION#/}"
          APP_DIR="/${LOCATION}"

          SERVER="${SERVER_USER}@${SERVER_HOST}"
          SERVICE_NAME="email"
          JAR_NAME="email-mqtt-client-service.jar"

          REMOTE_JAR="${APP_DIR}/${JAR_NAME}"
          REMOTE_ENV="${APP_DIR}/.env.email"

          SSH_OPTS=(
            -o StrictHostKeyChecking=no
            -o ConnectTimeout=20
            -p "$SSH_PORT"
          )

          SSH_CMD="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p ${SSH_PORT}"

          echo "Preparing deployment for ${SERVICE_NAME}..."
          echo "Target directory: ${APP_DIR}"
          echo "Spring profile: ${APP_PROFILE}"

          # Create deployment directory.
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "mkdir -p '$APP_DIR'"

          # Preserve an existing systemd service configuration.
          # Create a service only if one does not already exist.
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo bash -s -- '$SERVER_USER' '$APP_DIR' '$APP_PROFILE'" <<'REMOTE'
          set -euo pipefail

          APP_USER="$1"
          APP_DIR="$2"
          APP_PROFILE="$3"

          SERVICE_FILE="/etc/systemd/system/email.service"

          if ! systemctl cat email >/dev/null 2>&1; then
            echo "Creating systemd service..."

            JAVA_BIN="$(command -v java || true)"

            if [ -z "$JAVA_BIN" ]; then
              echo "ERROR: Java was not found on the server."
              exit 1
            fi

            tee "$SERVICE_FILE" >/dev/null <<UNIT
          [Unit]
          Description=Email MQTT Client Spring Boot Application
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User=$APP_USER
          WorkingDirectory=$APP_DIR
          EnvironmentFile=-$APP_DIR/.env.email
          ExecStart=$JAVA_BIN -Dspring.profiles.active=$APP_PROFILE -jar $APP_DIR/email-mqtt-client-service.jar
          Restart=on-failure
          RestartSec=10
          SuccessExitStatus=143
          TimeoutStopSec=30

          [Install]
          WantedBy=multi-user.target
          UNIT

            systemctl daemon-reload
          else
            echo "Existing systemd unit found; preserving its configuration."
          fi

          systemctl enable email

          echo "Stopping email service before deployment..."
          systemctl stop email
          REMOTE

          # Generate environment file without exposing secrets in logs.
          ENV_TMP="$(mktemp)"
          trap 'rm -f "$ENV_TMP"' EXIT
          export ENV_TMP

          python3 <<'PY'
          import os

          def systemd_quote(value):
              if "\n" in value or "\r" in value:
                  raise ValueError("Environment values must not contain newlines")
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'

          values = {
              "EUREKA_ADDRESS": os.environ["EUREKA_ADDRESS"],
              "EUREKA_PORT": os.environ["EUREKA_PORT"],
              "LOCATION": os.environ["LOCATION"],
              "DB_HOST": os.environ["DB_HOST"],
              "DB_PORT": os.environ["DB_PORT"],
              "DB_NAME": os.environ["DB_NAME"],
              "DB_USERNAME": os.environ["DB_USERNAME"],
              "DB_PASSWORD": os.environ["DB_PASSWORD"],
              "SMTP_HOST": os.environ["SMTP_HOST"],
              "SMTP_PORT": os.environ["SMTP_PORT"],
              "SMTP_EMAIL": os.environ["SMTP_EMAIL"],
              "SMTP_PASSWORD": os.environ["SMTP_PASSWORD"],
          }

          if os.environ["APP_PROFILE"] == "prod":
              values.update({
                  "MONGO_DB": os.environ["MONGO_DB"],
                  "MONGO_USERNAME": os.environ["MONGO_USERNAME"],
                  "MONGO_PASSWORD": os.environ["MONGO_PASSWORD"],
                  "MONGO_HOST": os.environ["MONGO_HOST"],
                  "MONGO_PORT": os.environ["MONGO_PORT"],
              })

          with open(os.environ["ENV_TMP"], "w", encoding="utf-8", newline="\n") as f:
              for key, value in values.items():
                  f.write(f"{key}={systemd_quote(value)}\n")
          PY

          echo "Uploading application JAR..."
          rsync -az \
            --chmod=F644 \
            -e "$SSH_CMD" \
            "$JAR_FILE" \
            "${SERVER}:${REMOTE_JAR}"

          echo "Uploading environment file with restricted permissions..."
          rsync -az \
            --chmod=F600 \
            -e "$SSH_CMD" \
            "$ENV_TMP" \
            "${SERVER}:${REMOTE_ENV}"

          echo "Verifying environment file permissions..."
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "stat -c '%a %U:%G %n' '$REMOTE_ENV'"

          # Stop any old nohup-managed Java instance left by the previous
          # production deployment. The systemd service has already been stopped.

          echo "Checking for legacy Java processes..."

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo bash -s -- '$REMOTE_JAR'" <<'REMOTE'
          set -euo pipefail

          APP_JAR="$1"

          # Only inspect Java processes. This excludes the SSH shell,
          # Bash cleanup script, and other non-Java commands.
          mapfile -t PIDS < <(
            ps -C java -o pid=,args= |
              awk -v jar="$APP_JAR" \
                'index($0, "-jar " jar) > 0 { print $1 }'
          )

          if [ "${#PIDS[@]}" -eq 0 ]; then
            echo "No legacy email Java process found."
            exit 0
          fi

          for PID in "${PIDS[@]}"; do
            STATE="$(ps -o stat= -p "$PID" 2>/dev/null | awk '{print $1}')"

            if [ -z "$STATE" ] || [[ "$STATE" == Z* ]]; then
              continue
            fi

            echo "Sending TERM to legacy email process $PID..."
            kill -TERM "$PID" 2>/dev/null || true
          done

          # Allow processes time to shut down gracefully.
          for attempt in $(seq 1 20); do
            REMAINING=0

            for PID in "${PIDS[@]}"; do
              STATE="$(ps -o stat= -p "$PID" 2>/dev/null | awk '{print $1}')"

              if [ -n "$STATE" ] && [[ "$STATE" != Z* ]]; then
                REMAINING=1
              fi
            done

            if [ "$REMAINING" -eq 0 ]; then
              break
            fi

            sleep 1
          done

          # Force-stop only processes that are still running.
          for PID in "${PIDS[@]}"; do
            STATE="$(ps -o stat= -p "$PID" 2>/dev/null | awk '{print $1}')"

            if [ -n "$STATE" ] && [[ "$STATE" != Z* ]]; then
              echo "Process $PID did not stop gracefully; sending KILL..."
              kill -KILL "$PID" 2>/dev/null || true
            fi
          done

          # Confirm termination without treating zombies as running processes.
          for attempt in $(seq 1 5); do
            REMAINING=0

            for PID in "${PIDS[@]}"; do
              STATE="$(ps -o stat= -p "$PID" 2>/dev/null | awk '{print $1}')"

              if [ -n "$STATE" ] && [[ "$STATE" != Z* ]]; then
                REMAINING=1
              fi
            done

            if [ "$REMAINING" -eq 0 ]; then
              break
            fi

            sleep 1
          done

          for PID in "${PIDS[@]}"; do
            STATE="$(ps -o stat= -p "$PID" 2>/dev/null | awk '{print $1}')"

            if [ -n "$STATE" ] && [[ "$STATE" != Z* ]]; then
              echo "ERROR: Legacy Java process $PID remains (state: $STATE)."
              exit 1
            fi
          done

          echo "Legacy Java process cleanup completed."
          REMOTE

          echo "Starting email service with systemd..."
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl start email"

          echo "Waiting for email service to become active..."

          if ! ssh "${SSH_OPTS[@]}" "$SERVER" \
            "for i in \$(seq 1 60); do
               if sudo systemctl is-active --quiet email; then
                 sudo systemctl status email --no-pager
                 exit 0
               fi
               sleep 1
             done
             exit 1"; then

            echo "ERROR: Email service failed to become active."

            ssh "${SSH_OPTS[@]}" "$SERVER" \
              "sudo systemctl status email --no-pager || true;
               sudo journalctl -u email -n 100 --no-pager || true"

            exit 1
          fi

          echo "Checking boot-time enablement..."
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl is-enabled email"

          echo "Email MQTT Client deployment completed successfully."
  

  deploy-alfuttaim:
    if: github.ref == 'refs/heads/alfuttaim'

    runs-on: ubuntu-latest

    env:
      APP_NAME: email-mqtt-client-service
      SERVICE_NAME: email-mqtt-client-service
      DEPLOY_DIR: 'C:\${{ secrets.WIN_LOCATION }}'
      JAR_NAME: email-mqtt-client-service.jar

    steps:
      #######################################################
      # Checkout Repository
      #######################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      #######################################################
      # Setup Java
      #######################################################
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ==========================
      # Build
      # ==========================
      - name: Build Application
        run: mvn clean package -DskipTests

      #######################################################
      # Locate JAR
      #######################################################
      - name: Locate Executable JAR
        shell: bash
        run: |

          JAR=$(find . \
            -type f \
            -path "*/target/*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            ! -name "*original*.jar" \
            | head -n1)

          if [ -z "$JAR" ]; then
            echo "Executable jar not found."
            exit 1
          fi

          echo "Found: $JAR"

          cp "$JAR" app.jar

      #######################################################
      # Generate WinSW XML
      #######################################################
      - name: Generate WinSW XML
        shell: bash
        run: |
          cp deployment/email-mqtt-client-service.xml.template email-mqtt-client-service.xml

          DB_PASSWORD_XML=$(printf '%s' "${{ secrets.DB_PASSWORD }}" \
            | sed -e 's/&/\&amp;/g' \
            -e 's/</\&lt;/g' \
            -e 's/>/\&gt;/g' \
            -e "s/'/\&apos;/g" \
            -e 's/"/\&quot;/g')

          DB_PASSWORD_XML=$(printf '%s' "$DB_PASSWORD_XML" | sed 's/&/\\&/g')

          sed -i "s|\${EUREKA_ADDRESS}|${{ secrets.EUREKA_ADDRESS }}|g" email-mqtt-client-service.xml
          sed -i "s|\${EUREKA_PORT}|${{ secrets.EUREKA_PORT }}|g" email-mqtt-client-service.xml
          sed -i "s|\${WIN_LOCATION}|C:/${{secrets.WIN_LOCATION}}|g" email-mqtt-client-service.xml
          sed -i "s|\${DB_HOST}|${{ secrets.DB_HOST }}|g" email-mqtt-client-service.xml
          sed -i "s|\${DB_PORT}|${{ secrets.DB_PORT }}|g" email-mqtt-client-service.xml
          sed -i "s|\${DB_NAME}|${{ secrets.DB_NAME }}|g" email-mqtt-client-service.xml

          sed -i "s|\${DB_USERNAME}|${{ secrets.DB_USERNAME }}|g" email-mqtt-client-service.xml
          sed -i "s|\${DB_PASSWORD}|${DB_PASSWORD_XML}|g" email-mqtt-client-service.xml
          sed -i "s|\${PROD_MONGO_HOST}|${{ secrets.PROD_MONGO_HOST }}|g" email-mqtt-client-service.xml

          sed -i "s|\${SMTP_HOST}|${{ secrets.SMTP_HOST }}|g" email-mqtt-client-service.xml
          sed -i "s|\${SMTP_PORT}|${{ secrets.SMTP_PORT }}|g" email-mqtt-client-service.xml
          sed -i "s|\${SMTP_EMAIL}|${{ secrets.SMTP_EMAIL }}|g" email-mqtt-client-service.xml
          sed -i "s|\${SMTP_PASSWORD}|${{ secrets.SMTP_PASSWORD }}|g" email-mqtt-client-service.xml
          
          sed -i "s|\${MONGO_DB}|${{ secrets.MONGO_DB }}|g" email-mqtt-client-service.xml
          sed -i "s|\${MONGO_USERNAME}|${{ secrets.MONGO_USERNAME }}|g" email-mqtt-client-service.xml
          sed -i "s|\${MONGO_PASSWORD}|${{ secrets.MONGO_PASSWORD }}|g" email-mqtt-client-service.xml
          sed -i "s|\${MONGO_HOST}|${{ secrets.MONGO_HOST }}|g" email-mqtt-client-service.xml
          sed -i "s|\${MONGO_PORT}|${{ secrets.MONGO_PORT }}|g" email-mqtt-client-service.xml


          echo "Generated WinSW XML:"

          cat email-mqtt-client-service.xml

      #######################################################
      # Configure SSH
      #######################################################
      - name: Configure SSH
        shell: bash
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.WINDOW_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan ${{ secrets.WINDOW_SERVER_HOST }} >> ~/.ssh/known_hosts

      #######################################################
      # Create Deployment Directory
      #######################################################
      - name: Create Deployment Directory
        run: |
          ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference = 'Stop'

          New-Item `
          -ItemType Directory `
          -Force `
          -Path 'C:/${{ secrets.WIN_LOCATION }}' | Out-Null

          New-Item `
          -ItemType Directory `
          -Force `
          -Path 'C:/${{ secrets.WIN_LOCATION }}/logs' | Out-Null

          Write-Host "Deployment directory ready."

          EOF

      #######################################################
      # Upload WinSW Wrapper
      #######################################################
      - name: Upload WinSW Wrapper
        run: |

          ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -" <<'EOF'

          if (Test-Path 'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.exe') {

           Write-Host "WinSW wrapper already exists."
           Write-Host "Skipping wrapper upload."

           exit 0
          }

          Write-Host "WinSW wrapper does not exist."
          Write-Host "Wrapper will be uploaded."

          EOF

          WRAPPER_EXISTS=$(ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -Command \"if (Test-Path 'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.exe') { exit 0 } else { exit 1 }\"" \
          >/dev/null 2>&1 && echo "yes" || echo "no")

          if [ "$WRAPPER_EXISTS" = "no" ]; then

          echo "Uploading email-mqtt-client-service.exe..."

          scp \
           -i ~/.ssh/id_rsa \
           -o StrictHostKeyChecking=no \
           -o ServerAliveInterval=30 \
           -o ServerAliveCountMax=10 \
           deployment/email-mqtt-client-service.exe \
           "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.exe"

          else

          echo "email-mqtt-client-service.exe already exists. Upload skipped."

          fi


      #######################################################
      # Stop WinSW Service
      #######################################################
      - name: Stop Windows Service
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference = 'Stop'

          $service = Get-Service -Name 'email-mqtt-client-service' -ErrorAction Stop
          
           if ($null -eq $service) {

            Write-Host "email-mqtt-client-service does not exist yet."
            Write-Host "Skipping stop. Service will be installed later."

            exit 0
          }

          Write-Host "Current Status: $($service.Status)"

          if ($service.Status -eq 'Running') {

              Write-Host "Stopping service..."

              Stop-Service -Name 'email-mqtt-client-service'

              $service.WaitForStatus(
                  'Stopped',
                  '00:00:30'
              )

          }

          $service = Get-Service -Name 'email-mqtt-client-service'

          if ($service.Status -ne 'Stopped') {

              throw "Failed to stop service."

          }

          Write-Host "Service stopped successfully."

          EOF

      #######################################################
      # Backup Existing JAR
      #######################################################
      - name: Backup Existing JAR
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference='Stop'

          $jar="C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.jar"

          $backup="C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.jar.bak"

          if(Test-Path $jar){

              Copy-Item `
                  $jar `
                  $backup `
                  -Force

              Write-Host "Backup completed."

          }
          else{

              Write-Host "No existing JAR. Backup skipped."

          }

          EOF

      #######################################################
      # Upload New JAR
      #######################################################
      - name: Upload Application
        run: |

          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            app.jar \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{secrets.WIN_LOCATION}}/email-mqtt-client-service.jar"

      #######################################################
      # Upload WinSW XML
      #######################################################
      - name: Upload WinSW XML
        run: |
          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            email-mqtt-client-service.xml \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{secrets.WIN_LOCATION}}/email-mqtt-client-service.xml"

      #######################################################
      # Install WinSW Service If Missing
      #######################################################
      - name: Install WinSW Service If Missing
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference = 'Stop'

          $serviceName = 'email-mqtt-client-service'

          $base = 'C:/${{ secrets.WIN_LOCATION }}'

          $wrapper = "$base/email-mqtt-client-service.exe"

          $config = "$base/email-mqtt-client-service.xml"

          $service = Get-Service `
            -Name $serviceName `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {

              Write-Host ""
              Write-Host "============================================"
              Write-Host "Installing WinSW Service"
              Write-Host "============================================"

              if (!(Test-Path -LiteralPath $wrapper -PathType Leaf)) {
                  throw "WinSW wrapper not found: $wrapper"
              }

              if (!(Test-Path -LiteralPath $config -PathType Leaf)) {
                  throw "WinSW configuration not found: $config"
              }

              Write-Host "Wrapper: $wrapper"
              Write-Host "Config:  $config"

              Push-Location $base

              try {

                  & $wrapper install

                  if ($LASTEXITCODE -ne 0) {
                      throw "WinSW service installation failed."
                  }

              }
              finally {

                  Pop-Location
              }

              Write-Host "WinSW service installed successfully."

          }
          else {

              Write-Host ""
              Write-Host "email-mqtt-client-service already exists."
              Write-Host "Skipping WinSW installation."

          }

          EOF

      #######################################################
      # Verify Uploaded Files
      #######################################################
      - name: Verify Upload
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

              $files = @(
                  'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.exe',
                  'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.jar',
                  'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.xml'
              )

              foreach($file in $files){

                  if(!(Test-Path $file)){
                      throw "Missing: $file"
                  }

                  Write-Host "Verified: $file"

              }

              Get-ChildItem C:\${{ secrets.WIN_LOCATION }}

            END

      #######################################################
      # Start Windows Service
      #######################################################
      - name: Start Windows Service
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference='Stop'

          Write-Host "Starting email-mqtt-client-service..."

          Start-Service -Name "email-mqtt-client-service"

          Start-Sleep -Seconds 5

          $service = Get-Service -Name "email-mqtt-client-service"

          $service.WaitForStatus(
              "Running",
              "00:00:30"
          )

          $service = Get-Service -Name "email-mqtt-client-service"

          if($service.Status -ne "Running"){

              throw "Service failed to start."

          }

          Write-Host "Service started successfully."

          EOF

      #######################################################
      # Verify Java Process
      #######################################################
      - name: Verify Java Process
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference='Stop'

          $java = Get-CimInstance Win32_Process |
          Where-Object {

              $_.Name -eq "java.exe" -and
              $_.CommandLine -like "*email-mqtt-client-service.jar*"

          }

          if(!$java){

              throw "Java process not running."

          }

          Write-Host "Java PID: $($java.ProcessId)"

          EOF

      #######################################################
      # Verify Deployment
      #######################################################
      - name: Verify Deployment
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            powershell -Command "

            Write-Host ''

            Write-Host '========== SERVICE =========='

            Get-Service email-mqtt-client-service

            Write-Host ''

            Write-Host '========== FILES =========='

            Get-ChildItem C:/${{ secrets.WIN_LOCATION}}

            Write-Host ''

            Write-Host '========== LOGS =========='

            Get-ChildItem C:/${{ secrets.WIN_LOCATION }}/logs -ErrorAction SilentlyContinue

            "
      #######################################################
      # Display Logs On Failure
      #######################################################
      - name: Display Logs
        if: failure()
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            powershell -Command "

            Write-Host ''
            Write-Host '========== WinSW OUT =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.out.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.out.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== WinSW ERR =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.err.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/email-mqtt-client-service.err.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== WRAPPER LOG =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/wrapper.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/wrapper.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== SPRING LOG =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/logs/email.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/logs/email.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== GC LOG =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/logs/gc.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/logs/gc.log' -Tail 100
            }

            "




